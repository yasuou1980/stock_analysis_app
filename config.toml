
# 設定ファイル

[tickers]
# Streamlit アプリのサイドバーに表示する銘柄
default_tickers = ["SOXL", "SOXS", "TQQQ", "FNGG", "TSLL", "NUGT", "SOFI", "CLSK"]

[ticker_classes]
# 商品クラス定義 (シグナルゲートで使用。未記載のティッカーは plain 扱い)
# inverse_lev: インバース型レバレッジETF。構造的減価があるため BUY シグナル禁止
# long_lev:    ロング型レバレッジETF。急落後の反発が大きいため SELL シグナルを制限
inverse_lev = ["SOXS", "SQQQ", "SPXS"]
long_lev = ["SOXL", "TQQQ", "UPRO", "TECL", "TSLL", "NUGT", "FNGG"]

[batch]
# バッチ実行で分析する銘柄リスト (Streamlit アプリとは独立して管理)
tickers = [
  # --- 半導体・ハイテク ---
  "NVDA", "AMD", "TSM", "INTC", "AVGO", "QCOM", "MU", "AMAT",
  # --- 主要テック ---
  "AAPL", "MSFT", "GOOGL", "META", "AMZN",
  # --- レバレッジ ETF (半導体) ---
  "SOXL", "SOXS",
  # --- レバレッジ ETF (ナスダック・S&P) ---
  "TQQQ", "SQQQ", "UPRO", "SPXS",
  # --- テーマ型 ETF ---
  "FNGG", "TECL", "TSLL", "NUGT",
  # --- 個別グロース ---
  "SOFI", "CLSK", "MSTR", "COIN",
  # --- 主要インデックス ETF ---
  "SPY", "QQQ", "IWM",
]
# 分析に使う過去データの日数
lookback_days = 365
# 結果を保存するディレクトリ (batch_runner.py からの相対パス)
results_dir = "results"

[swing]
# スイング候補の売買プランと保有ポジション判定の既定値 (アプリ画面で一時的に変更可)。
# このファイルは git で公開されるため、account_size に実際の資金額は書かないこと
# (日次レポートは資金額を使わず、資金に対する比率で建玉を表示する)
account_size = 10000      # 資金 ($)。アプリ画面の初期値
risk_pct = 1.0            # 1 トレードで失ってよい資金の割合 (%)
stop_atr_mult = 2.0       # 損切り幅 = ATR(14) × この倍率
max_hold_days = 10        # 買った日を 1 日目として、この営業日目の引けで手仕舞う
max_position_pct = 25.0   # 1 銘柄の建玉上限 (資金に対する %)
